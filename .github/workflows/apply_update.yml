name: Aplica actualizare

# LIVRAREA DINTR-UN SINGUR FISIER. Urci update.zip in radacina repo-ului (Add file
# -> Upload files - merge si din browserul telefonului), iar acest workflow:
#   0. salveaza versiunea curenta (cod + date) pentru poarta de echivalenta
#   1. despacheteaza arhiva DOAR in caile permise (module .py din radacina,
#      dashboard/, selfrepair/, improve/, adapters/, core/, ports/, tests/,
#      .github/workflows/*.yml, *.md) - niciodata in data/ sau docs/, niciodata
#      in afara repo-ului. adapters/ = cate un modul per bursa (Etapa 1);
#      core/, ports/ si tests/ = arhitectura hexagonala (Etapele 2 si 3)
#   2. sterge fisierele listate in DELETE.txt din arhiva (aceleasi reguli)
#   3. ruleaza garzile: check_py311.py (sintaxa 3.11, nume nedefinite) si
#      check_integrity.py (coerenta, continut urcat in fisierul gresit)
#   4. face commit DOAR daca toate trec; altfel nu schimba nimic si jobul
#      esueaza - primesti notificare, iar repo-ul ramane exact cum era
# Inlocuieste urcarea manuala fisier cu fisier, unde continutul ajungea in
# fisierul gresit (s-a intamplat de trei ori).
# EXCEPTIE: fisierele din .github/workflows/ nu pot fi modificate de un workflow
# (regula de securitate GitHub, valabila si pe repo-uri publice) - se urca manual.
on:
  push:
    paths:
      - "update.zip"
      - "updates/*.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scanner-data
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    # poarta de echivalenta ruleaza scanarea de 2 x 3 ori pe date reale (circa 5-10 minute)
    timeout-minutes: 40
    env:
      SCAN_TIMEFRAME: 4h
    steps:
      - name: Descarca repo-ul
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Despacheteaza, valideaza si aplica
        run: |
          git config user.name "crypto-ai-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          # starea CURENTA a lui main, inainte de orice: daca arhiva a fost stearsa intre
          # timp, nu exista nimic de aplicat (si nu apare niciun conflict la push)
          git pull --ff-only -q || true
          # fara `ls` pe cai inexistente: cu `bash -eo pipefail` (shell-ul implicit din
          # Actions) eroarea lui ls ar fi oprit scriptul la fiecare rulare
          zip=""
          for c in update.zip updates/*.zip; do
            if [ -f "$c" ]; then zip="$c"; break; fi
          done
          if [ -z "$zip" ]; then
            echo "Nicio arhiva update.zip in main (posibil stearsa inainte de aplicare) - nimic de aplicat." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Instantaneul versiunii CURENTE (cod + date), inainte de despachetare: poarta de
          # echivalenta ruleaza aceeasi scanare pe el si pe versiunea noua si le compara.
          rm -rf /tmp/baseline && mkdir -p /tmp/baseline
          git archive HEAD | tar -x -C /tmp/baseline
          rm -f /tmp/expected_changes.txt
          python3 - "$zip" <<'PY'
          import os, re, sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          ok = re.compile(r"^([A-Za-z0-9_]+\.(py|md)|(dashboard|selfrepair|improve|adapters|core|ports|tests)/[A-Za-z0-9_./-]+"
                          r"|\.github/workflows/[A-Za-z0-9_-]+\.ya?ml)$")
          def clean(n):
              n = n.replace("\\", "/")
              return n[len("livrare/"):] if n.startswith("livrare/") else n
          names = [clean(n) for n in z.namelist() if not n.endswith("/")]
          special = ("DELETE.txt", "EXPECTED_CHANGES.txt")
          bad = [n for n in names if n not in special and (".." in n.split("/") or n.startswith("/") or not ok.match(n))]
          if bad:
              sys.exit(f"Arhiva contine cai nepermise: {bad[:5]} - nu aplic nimic.")
          # GitHub interzice token-ului automat (GITHUB_TOKEN) sa modifice fisiere din
          # .github/workflows/ - push-ul intreg ar fi respins. Le sar si le raportez:
          # se urca manual (Add file -> Upload files in .github/workflows/).
          skipped = []
          for info in z.infolist():
              n = clean(info.filename)
              if info.filename.endswith("/") or n in special:
                  continue
              if n.startswith(".github/"):
                  skipped.append(n)
                  continue
              os.makedirs(os.path.dirname(n) or ".", exist_ok=True)
              with open(n, "wb") as f:
                  f.write(z.read(info))
              print("  scris:", n)
          if "DELETE.txt" in names:
              raw = z.read(next(i for i in z.infolist() if clean(i.filename) == "DELETE.txt")).decode()
              for n in (l.strip() for l in raw.splitlines()):
                  if not n or n.startswith("#"):
                      continue
                  if ".." in n.split("/") or not ok.match(n):
                      sys.exit(f"DELETE.txt contine o cale nepermisa: {n}")
                  if n.startswith(".github/"):
                      skipped.append(n)
                      continue
                  if os.path.exists(n):
                      os.remove(n)
                      print("  sters:", n)
          if "EXPECTED_CHANGES.txt" in names:
              # schimbarile de comportament ASUMATE: tiparele fisierelor care au voie sa difere
              # in poarta de echivalenta (cu motivul in comentarii); nu se scrie in repo
              raw = z.read(next(i for i in z.infolist() if clean(i.filename) == "EXPECTED_CHANGES.txt"))
              with open("/tmp/expected_changes.txt", "wb") as fh:
                  fh.write(raw)
              print("  schimbari asumate declarate:", [l for l in raw.decode().splitlines() if l.strip()][:8])
          if skipped:
              msg = ("Fisiere de workflow SARITE (GitHub nu permite workflow-urilor sa le modifice) - "
                     "urca-le manual in .github/workflows/: " + ", ".join(skipped))
              print(msg)
              with open(os.environ.get("GITHUB_STEP_SUMMARY", os.devnull), "a") as fh:
                  fh.write(msg + "\n")
          PY
          if [ $? -ne 0 ]; then git checkout -- . ; git clean -fdq -- dashboard selfrepair improve adapters core ports tests .github ; exit 1; fi
          # POARTA DE ECHIVALENTA (tests/): gărzile se verifica pe cod stricat intentionat,
          # apoi scanarea si pasii de dupa ea ruleaza pe versiunea veche si pe cea noua, cu
          # aceleasi date si acelasi timp; orice diferenta nedeclarata in EXPECTED_CHANGES.txt
          # sau orice pas care esueaza doar pe versiunea noua respinge actualizarea.
          gate() {
            if [ ! -f tests/equivalence.py ]; then echo "(fara tests/: poarta de echivalenta sarita)"; return 0; fi
            python3 -B -m tests.guards && python3 -B -m tests.equivalence --baseline /tmp/baseline --candidate . \
              --allow /tmp/expected_changes.txt --summary "$GITHUB_STEP_SUMMARY"
          }
          if python3 check_py311.py && python3 check_integrity.py && gate; then
            git rm -q --cached "$zip" 2>/dev/null; rm -f "$zip"
            # tot repo-ul: workflow-ul nu atinge data/ sau docs/, iar caile care nu
            # exista (ex. selfrepair/ inainte de instalare) ar fi anulat toata comanda
            git add -A
            git commit -qm "actualizare aplicata: $(basename "$zip")"
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase -q && git push -q; then pushed=1; break; fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            # push esuat = job ROSU: varianta anterioara afisa "aplicata" chiar daca
            # nimic nu ajunsese in repo (ex. arhiva stearsa in timp ce jobul rula)
            if [ "$pushed" != "1" ]; then
              echo "Push esuat dupa 3 incercari - actualizarea NU a ajuns in repo. Urca din nou update.zip si nu o sterge: workflow-ul o sterge singur." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "Actualizare aplicata si verificata: $(git show --stat --format= HEAD | tail -1)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Garzile sau poarta de echivalenta au respins actualizarea - NU aplic nimic; repo-ul ramane neschimbat (detalii mai sus in jurnal). O schimbare de comportament voita se declara in EXPECTED_CHANGES.txt, in arhiva." | tee -a "$GITHUB_STEP_SUMMARY"
            git checkout -- . ; git clean -fdq -- dashboard selfrepair improve adapters core ports tests .github
            exit 1
          fi
