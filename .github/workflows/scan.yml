name: Crypto AI Scanner

# Ruleaza automat la fiecare 4 ore (minutul 7, ca sa evite varful de trafic
# de la minutul 0 de pe serverele GitHub) - calculat sa ramana sub cele
# 2000 min/luna gratuite pe repo privat, la universe_size=200. Poti da
# click manual pe "Run workflow" din tab-ul Actions oricand vrei un test.
on:
  schedule:
    - cron: '7 */4 * * *'
  workflow_dispatch: {}

# Necesar ca job-ul sa poata face "git push" cu rezultatele scanarii
# (data/scan_history.json si data/weights.json) inapoi in repo.
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instaleaza dependinte
        run: pip install ccxt requests

      - name: Ruleaza scannerul (fallback de exchange e acum intern, in cod)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto_ai_scanner.py

      - name: Actualizeaza metadata proiecte (CoinGecko + optional Gemini)
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_token_metadata.py

      - name: Genereaza pagina dashboard (docs/index.html)
        run: python generate_dashboard.py

      - name: Trimite digest pe email (doar la fiecare 4 ore)
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GITHUB_PAGES_URL: https://hdmihai.github.io/scanner/
        run: python send_email_digest.py

      - name: Salveaza memoria (data/) si pagina (docs/) inapoi in repo
        run: |
          git config user.name "crypto-ai-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/
          git diff --staged --quiet || git commit -m "scan $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
