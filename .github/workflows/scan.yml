name: Crypto AI Scanner

# Ruleaza automat la fiecare 4 ore (minutul 7, ca sa evite varful de trafic
# de la minutul 0 de pe serverele GitHub) - calculat sa ramana sub cele
# 2000 min/luna gratuite pe repo privat, la universe_size=200. Poti da
# click manual pe "Run workflow" din tab-ul Actions oricand vrei un test.
on:
  schedule:
    - cron: '7 */4 * * *'
  workflow_dispatch: {}

# Necesar ca job-ul sa poata face "git push" cu rezultatele scanarii
# (data/scan_history.json si data/weights.json) inapoi in repo.
permissions:
  contents: write
  actions: write   # necesar pentru stergerea run-urilor vechi (pasul de la final)

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instaleaza dependinte
        run: pip install ccxt requests

      - name: Ruleaza scannerul (fallback de exchange e acum intern, in cod)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto_ai_scanner.py

      - name: Antreneaza agentul AI pe semnalele nou evaluate
        run: python ai_agent.py

      - name: Genereaza briefing-ul narativ
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python briefing.py

      - name: Compacteaza istoricul vechi (tine repo-ul mic)
        run: python compact_history.py

      - name: Actualizeaza metadata proiecte (CoinGecko + optional Gemini)
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_token_metadata.py

      - name: Genereaza pagina dashboard (docs/index.html)
        run: python generate_dashboard.py

      - name: Trimite digest pe email (doar la fiecare 4 ore)
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GITHUB_PAGES_URL: https://hdmihai.github.io/scanner/
        run: python send_email_digest.py

      - name: Salveaza memoria (data/) si pagina (docs/) inapoi in repo
        # if: always() - ruleaza chiar daca un pas anterior a esuat. Altfel, o
        # eroare in metadata/email (ex: rate limit CoinGecko) ar omori job-ul
        # inainte de salvare si s-ar pierde toata scanarea. Daca nu s-a
        # schimbat nimic, `git diff --staged --quiet` face pasul un no-op.
        if: always()
        run: |
          git config user.name "crypto-ai-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/
          git diff --staged --quiet || git commit -m "scan $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Pastreaza doar ultimele 30 de run-uri
        # Sterge DOAR inregistrarile de executie din tab-ul Actions (loguri,
        # status, durata). NU atinge datele agentului: plans.json,
        # agent_model.json si scan_history.json sunt comise in git de pasul de
        # mai sus, deci traiesc in istoricul repo-ului, nu in run-uri.
        # Workflow-ul nu foloseste artifacts, deci nu se pierde nimic functional.
        # Ce se pierde: logurile mai vechi de 30 de rulari, adica ~5 zile de
        # diagnostic la cadenta de 4h. Suficient pentru depanare.
        if: always()
        continue-on-error: true   # curatenia nu are voie sa strice scanarea
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: 30
        run: |
          # Exclud run-urile in curs sau in asteptare - altfel acest run s-ar
          # sterge singur, iar API-ul ar returna eroare.
          # Fara --paginate intentionat: `gh api --paginate` aplica filtrul --jq
          # pe FIECARE pagina separat, deci ar pastra 30 de run-uri din fiecare
          # pagina in loc de 30 in total. Cu per_page=100 acopar cazul normal;
          # daca vreodata sunt mai multe, se curata progresiv la rulari succesive.
          ids=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/scan.yml/runs?per_page=100" \
            --jq '.workflow_runs
                  | map(select(.status != "in_progress" and .status != "queued"))
                  | sort_by(.created_at) | reverse
                  | .['"${KEEP}"':] | .[].id')
          count=$(echo "$ids" | grep -c . || true)
          echo "Run-uri de sters (pastrez ultimele ${KEEP}): ${count}"
          for id in $ids; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/$id" \
              && echo "  sters $id" || echo "  [!] nu am putut sterge $id"
          done
