name: Crypto AI Scanner

# Ruleaza automat la fiecare ora (minutul 7, ca sa evite varful de trafic
# de la minutul 0 de pe serverele GitHub) + poti da click manual pe
# "Run workflow" din tab-ul Actions oricand vrei un test imediat.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch: {}

# Necesar ca job-ul sa poata face "git push" cu rezultatele scanarii
# (data/scan_history.json si data/weights.json) inapoi in repo.
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instaleaza dependinte
        run: pip install ccxt requests

      - name: Ruleaza scannerul cu fallback automat de exchange
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional: change the fallback order without editing code.
          # Example:
          # CRI_EXCHANGE_ORDER: okx,kucoin,gateio,bitget,mexc,kraken,coinbase
        run: python run_scanner_with_exchange_fallback.py

      - name: Actualizeaza metadata proiecte (CoinGecko + optional Gemini)
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_token_metadata.py

      - name: Genereaza pagina dashboard (docs/index.html)
        run: python generate_dashboard.py

      - name: Salveaza memoria (data/) si pagina (docs/) inapoi in repo
        run: |
          git config user.name "crypto-ai-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/
          git diff --staged --quiet || git commit -m "scan $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
