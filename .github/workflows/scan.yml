name: Crypto AI Scanner

# Ruleaza automat la fiecare ora (minutul 7, ca sa evite varful de trafic de
# la minutul 0 de pe serverele GitHub). Repo-ul e public, deci minutele Actions
# sunt nelimitate - limita de 2000/luna se aplica doar repo-urilor private. Poti da
# click manual pe "Run workflow" din tab-ul Actions oricand vrei un test.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      timeframe:
        description: "Timeframe pentru ACEASTA rulare manuala. Implicit 4h la rularile programate."
        required: true
        default: "4h"
        type: choice
        options: ["15m", "1h", "4h", "1d"]

# Necesar ca job-ul sa poata face "git push" cu rezultatele scanarii
# (data/scan_history.json si data/weights.json) inapoi in repo.
# Serializeaza cu backtest.yml: amandoua scriu in data/ si ar intra in conflict
# la push daca ar rula simultan. Grupul functioneaza doar daca AMBELE il declara.
concurrency:
  group: scanner-data
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # necesar pentru stergerea run-urilor vechi (pasul de la final)

jobs:
  scan:
    runs-on: ubuntu-latest
    # Fara timeout, GitHub aplica 360 de minute: un API de bursa blocat ar tine
    # scanarea orara agatata 6 ore si le-ar bloca pe urmatoarele (concurrency).
    timeout-minutes: 30
    env:
      # Trebuie sa fie ACELASI ca la backtest, altfel scanarea live si
      # backtest-ul produc geometrii diferite si nu invata din acelasi set.
      # La rularile MANUALE ia valoarea din formular; la cele programate `inputs`
      # e gol, deci cade pe implicit. Asa poti testa alt timeframe cu un click,
      # fara sa editezi fisierul.
      #
      # DE CE 4h, MASURAT pe 5 ani si 54 de simboluri, walk-forward:
      #   1h -> -0.0355R/plan, profit factor 0.95
      #   4h -> +0.0232R/plan, profit factor 1.04, IC95 +0.0004..+0.0460
      # Rata de castig e aproape identica (32.4% vs 31.9%). Diferenta e strict
      # economica: costul de tranzactionare e fix (~0.085R), iar pe 4h aceeasi
      # logica prinde miscari de patru ori mai ample, deci costul cantareste
      # mult mai putin relativ la castig.
      #
      # CRON-UL RAMANE ORAR, desi timeframe-ul e 4h. Nu e o scapare: programarile
      # GitHub intarzie imprevizibil (am masurat rulari intre minutul 9 si 59 la
      # un cron setat pe 7). Cu cron la 4h ai risca sa scanezi chiar inainte de
      # inchiderea unei bare si sa astepti alte 4 ore. Scanand orar, prinzi bara
      # noua in cel mult o ora. Cele 3 rulari din 4 care vad aceleasi bare inchise
      # nu produc nimic si nu strica nimic - minutele sunt nelimitate pe repo public.
      SCAN_TIMEFRAME: ${{ inputs.timeframe || '4h' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instaleaza dependinte
        run: pip install ccxt requests

      - name: Verifica coerenta versiunilor din repo
        # Prinde amestecul de versiuni: fisiere lipsa apelate de workflow,
        # geometrie fara timeframe, agent care nu urmeaza geometria, poarta
        # de decizie fara comutator. Fara verificarea asta, un repo cu fisiere
        # inlocuite partial ruleaza si invata din date corupte, in tacere.
        run: python check_integrity.py

      - name: Verifica compatibilitatea cu Python 3.11
        # Ruleaza INAINTE de orice altceva: daca un fisier are sintaxa valida
        # doar pe 3.12 (f-string-uri imbricate, PEP 701), pica aici cu mesaj
        # clar, in loc sa opreasca workflow-ul la jumatate cu SyntaxError.
        run: python check_py311.py

      - name: Ruleaza scannerul (fallback de exchange e acum intern, in cod)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto_ai_scanner.py

      - name: Antreneaza agentul AI pe semnalele nou evaluate
        run: python ai_agent.py

      - name: Genereaza briefing-ul narativ
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python briefing.py

      - name: Compacteaza istoricul vechi (tine repo-ul mic)
        run: python compact_history.py

      - name: Actualizeaza metadata proiecte (CoinGecko + optional Gemini)
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_token_metadata.py

      - name: Genereaza pagina dashboard (docs/index.html)
        run: python generate_dashboard.py

      - name: Trimite digest pe email (doar la fiecare 4 ore)
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GITHUB_PAGES_URL: https://hdmihai.github.io/scanner/
        run: python send_email_digest.py

      - name: Compacteaza plans.json inainte de commit
        # ULTIMUL pas inainte de commit, si singurul care garanteaza dimensiunea.
        # Garda din plan_tracker.save_plans e ocolita de orice modul care scrie
        # plans.json direct - backtest.py a facut exact asta si a produs 100.98 MB,
        # respins de GitHub de doua ori. Un pas separat nu poate fi ocolit,
        # indiferent ce versiune are fiecare fisier .py.
        if: always()
        env:
          SCAN_TIMEFRAME: ${{ inputs.timeframe || '4h' }}
        run: python compact_plans.py

      - name: Salveaza memoria (data/) si pagina (docs/) inapoi in repo
        # if: always() - ruleaza chiar daca un pas anterior a esuat. Altfel, o
        # eroare in metadata/email (ex: rate limit CoinGecko) ar omori job-ul
        # inainte de salvare si s-ar pierde toata scanarea. Daca nu s-a
        # schimbat nimic, `git diff --staged --quiet` face pasul un no-op.
        if: always()
        run: |
          git config user.name "crypto-ai-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/
          git diff --staged --quiet || git commit -m "scan $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Curata istoricul de rulari (pastreaza ultimele 3 zile)
        # Sterge inregistrarile de executie din tab-ul Actions - loguri, status,
        # durata. NU atinge datele agentului: plans.json, agent_model.json si
        # scan_history.json sunt comise in git de pasul de mai sus.
        #
        # DOUA SCHIMBARI fata de varianta anterioara, dupa ce s-au acumulat 299
        # de rulari:
        #   1. Criteriu de TIMP (3 zile), nu de numar (30). La o cadenta orara,
        #      30 de rulari inseamna ~1.2 zile; la una manuala, luni intregi.
        #      Timpul e masura pe care o vrei de fapt.
        #   2. TOATE workflow-urile, nu doar scan.yml. Varianta veche interoga
        #      `actions/workflows/scan.yml/runs`, deci Backtest si
        #      pages-build-deployment se acumulau nelimitat - cele din urma
        #      sunt generate automat de GitHub Pages la fiecare commit.
        #
        # Plasa de siguranta: ultimele KEEP_MIN rulari raman mereu, indiferent
        # de varsta, ca sa nu ramai fara niciun log daca repo-ul sta o saptamana.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_DAYS: 3
          KEEP_MIN: 5
          MAX_PAGES: 5
        run: |
          set -o pipefail
          CUTOFF=$(date -u -d "${KEEP_DAYS} days ago" +%Y-%m-%dT%H:%M:%SZ)
          echo "Sterg rularile finalizate inainte de ${CUTOFF} (pastrez minim ${KEEP_MIN})."
          echo "### Curatare istoric rulari" >> "$GITHUB_STEP_SUMMARY"

          total=0; deleted=0; failed=0; kept=0; idx=0
          for page in $(seq 1 "$MAX_PAGES"); do
            if ! batch=$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100&page=${page}" \
                --jq '.workflow_runs
                      | map(select(.status != "in_progress" and .status != "queued"))
                      | sort_by(.created_at) | reverse
                      | .[] | [.id, .created_at, .name] | @tsv' 2>&1); then
              echo "[!] Nu am putut lista rularile: ${batch}"
              {
                echo "**ESUAT** - nu am putut lista rularile."
                echo "Verifica permisiunea \`actions: write\`."
                echo "\`\`\`"; echo "${batch}"; echo "\`\`\`"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            [ -z "$batch" ] && break

            while IFS=$'\t' read -r id created name; do
              [ -z "$id" ] && continue
              total=$((total + 1)); idx=$((idx + 1))
              if [ "$idx" -le "$KEEP_MIN" ]; then kept=$((kept + 1)); continue; fi
              if [[ "$created" < "$CUTOFF" ]]; then
                if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/$id" >/dev/null 2>&1; then
                  deleted=$((deleted + 1))
                else
                  failed=$((failed + 1))
                  echo "  [!] nu am putut sterge ${id} (${name})"
                fi
              else
                kept=$((kept + 1))
              fi
            done <<< "$batch"
          done

          echo "Analizate ${total}. Pastrate ${kept}. Sterse ${deleted}. Esuate ${failed}."
          {
            echo "- Prag: rulari mai vechi de **${KEEP_DAYS} zile**"
            echo "- Analizate: **${total}** | Pastrate: **${kept}**"
            echo "- Sterse: **${deleted}** | Esuate: **${failed}**"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$failed" -gt 0 ] && [ "$deleted" -eq 0 ]; then
            echo "[!] ATENTIE: nicio stergere nu a reusit."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**ATENTIE:** nicio stergere nu a reusit - verifica \`actions: write\`." >> "$GITHUB_STEP_SUMMARY"
          fi
