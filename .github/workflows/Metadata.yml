name: Metadata proiecte (Similar projects)

# Actualizeaza sectiunea "Similar projects" din dashboard.
#
# DE PE TELEFON: aplicatia GitHub -> repo-ul scanner -> Actions ->
# "Metadata proiecte (Similar projects)" -> Run workflow.
# (sau din browser: github.com/hdmihai/scanner/actions)
#
# Ruleaza si automat, saptamanal, ca informatiile sa nu imbatraneasca. Scanarea
# orara o actualizeaza oricum incremental, cand lipsesc tokeni.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Reimprospateaza TOTI tokenii (altfel doar cei lipsa, vechi sau rezolvati gresit)"
        type: boolean
        default: true
  schedule:
    - cron: "37 3 * * 1"

permissions:
  contents: write

# Acelasi grup ca scanarea si backtest-ul: ruleaza pe rand, deci doua rulari nu
# pot incerca sa urce in acelasi timp si push-ul nu se ciocneste.
concurrency:
  group: scanner-data
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descarca repo-ul
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verifica fisierele (Python 3.11 si nume nedefinite)
        run: python check_py311.py

      - name: Actualizeaza metadata proiecte (CoinGecko + optional Gemini)
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE: ${{ github.event_name == 'schedule' && 'true' || inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            python update_token_metadata.py --force
          else
            python update_token_metadata.py
          fi

      - name: Regenereaza dashboard-ul
        run: python generate_dashboard.py

      - name: Salveaza metadata si pagina in repo
        run: |
          git config user.name "crypto-ai-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/token_metadata.json docs/
          if git diff --staged --quiet; then
            echo "Nimic nou de salvat."
            exit 0
          fi
          git commit -m "metadata $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase
          git push
