name: Heartbeat scanare

# Programarea orara din GitHub Actions e "best effort": in productie, scanarea
# programata la fiecare ora a rulat doar la 4-7 ore (masurat pe istoricul de
# commit-uri, 1-3 octombrie 2026). Acest workflow, scurt si gratuit pe un repo
# public, ruleaza de 4 ori pe ora si porneste scanarea DOAR daca ultima scanare
# urcata e mai veche de 70 de minute si nu e deja una in curs.
on:
  schedule:
    # minute in afara orelor fixe: la :00/:15/:30/:45 GitHub omite cele mai multe rulari
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Porneste scanarea daca a fost omisa
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          last=$(gh api "repos/$REPO/commits?path=data/latest_details.json&per_page=1" --jq '.[0].commit.committer.date')
          age=$(( $(date +%s) - $(date -d "$last" +%s) ))
          echo "Ultima scanare urcata: $last (acum $((age / 60)) minute)"
          active=$(gh run list -R "$REPO" --workflow scan.yml --limit 5 --json status \
            --jq '[.[] | select(.status != "completed")] | length')
          failed=$(gh run list -R "$REPO" --workflow scan.yml --limit 3 --json conclusion \
            --jq '[.[] | select(.conclusion == "failure")] | length')
          # plasa de siguranta: daca ceasul (keeper.yml) nu ruleaza, il repornesc
          keeper=$(gh run list -R "$REPO" --workflow keeper.yml --limit 3 --json status \
            --jq '[.[] | select(.status != "completed")] | length' || echo 1)
          if [ "$keeper" = "0" ]; then
            echo "Ceasul de scanare nu ruleaza - il repornesc."
            gh workflow run keeper.yml -R "$REPO" || true
          fi
          if [ "$age" -le 4200 ]; then
            echo "Scanare recenta - nimic de facut."
          elif [ "$active" != "0" ]; then
            echo "O scanare e deja in curs sau in asteptare ($active) - nimic de facut."
          elif [ "$failed" = "3" ]; then
            echo "Ultimele 3 scanari au esuat - nu le repornesc in bucla; vezi jurnalul scanarii."
          else
            echo "Pornesc scanarea omisa de programarea GitHub."
            gh workflow run scan.yml -R "$REPO" -f source=heartbeat
          fi
